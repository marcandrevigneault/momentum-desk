name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint + test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: pytest
      - name: Smoke — scanner + account simulation
        run: |
          python -m momentum_desk.cli --ticks 3 --interval 0
          python -c "from momentum_desk.backtest import SyntheticHistory; from momentum_desk.edge.portfolio import run_simulation; r = run_simulation(SyntheticHistory(days=10, session='intraday')); assert r.metrics['trades'] > 0; print('smoke:', r.metrics['trades'], 'trades')"
          python -c "from momentum_desk.insider.bundles import SyntheticInsiderBundle, run_insider_strategy; from momentum_desk.edge.strategy import Strategy; from momentum_desk.risk import RiskConfig; r = run_insider_strategy(Strategy(name='smoke', kind='insider'), SyntheticInsiderBundle(days=60), RiskConfig()); assert r.metrics['trades'] > 0, r.metrics; print('smoke:', r.metrics['trades'], 'trades')"

  web:
    name: build dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Upload dashboard build
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: web/dist
          retention-days: 7
